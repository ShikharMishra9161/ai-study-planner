<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="AI-powered study planner for smarter learning and productivity."
    />

    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <title>AI Study Planner</title>

    <!-- Apply the saved theme before first paint so light mode doesn't flash dark -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || (!theme && matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
